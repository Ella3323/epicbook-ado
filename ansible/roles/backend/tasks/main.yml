---
- name: Add NodeSource repository (Node.js {{ node_major }}.x LTS)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://deb.nodesource.com/setup_{{ node_major }}.x | bash -
  args:
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js, MySQL client tools and PyMySQL
  ansible.builtin.apt:
    name:
      - nodejs
      - mysql-client
      - python3-pymysql   # needed by the community.mysql modules
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Deploy EpicBook code from GitHub
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
    force: true
  become_user: "{{ app_user }}"
  register: app_code
  notify: Restart epicbook

- name: Check whether dependencies are installed
  ansible.builtin.stat:
    path: "{{ app_dir }}/node_modules"
  register: node_modules_dir

- name: Install Node.js dependencies from package-lock.json
  ansible.builtin.command: npm ci --omit=dev
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  when: app_code.changed or not node_modules_dir.stat.exists
  notify: Restart epicbook

- name: Create protected config directory
  ansible.builtin.file:
    path: /etc/epicbook
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write EpicBook environment file (contains DB credentials - root only)
  ansible.builtin.template:
    src: epicbook.env.j2
    dest: /etc/epicbook/epicbook.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart epicbook

- name: Install EpicBook systemd service
  ansible.builtin.template:
    src: epicbook.service.j2
    dest: /etc/systemd/system/epicbook.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart epicbook

- name: Enable EpicBook at boot
  ansible.builtin.systemd:
    name: epicbook
    enabled: true
    daemon_reload: true
