---
- name: Backend can resolve and reach private MySQL on 3306
  ansible.builtin.wait_for:
    host: "{{ mysql_fqdn }}"
    port: 3306
    timeout: 60

- name: Ensure the application database exists
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  no_log: true

- name: Check whether the schema is already imported
  community.mysql.mysql_query:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    login_db: "{{ db_name }}"
    query: "SELECT COUNT(*) AS n FROM information_schema.tables WHERE table_schema = %s AND table_name = 'Author'"
    positional_args:
      - "{{ db_name }}"
  register: schema_check
  no_log: true

- name: Import schema (first run only)
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "{{ app_dir }}/db/BuyTheBook_Schema.sql"
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  when: schema_check.query_result[0][0].n | int == 0
  no_log: true

- name: Count existing authors
  community.mysql.mysql_query:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    login_db: "{{ db_name }}"
    query: "SELECT COUNT(*) AS n FROM Author"
  register: author_count
  no_log: true

- name: Import author seed data (only if empty - no duplicates)
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "{{ app_dir }}/db/author_seed.sql"
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  when: author_count.query_result[0][0].n | int == 0
  no_log: true

- name: Count existing books
  community.mysql.mysql_query:
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    login_db: "{{ db_name }}"
    query: "SELECT COUNT(*) AS n FROM Book"
  register: book_count
  no_log: true

- name: Import book seed data (only if empty - no duplicates)
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "{{ app_dir }}/db/books_seed.sql"
    login_host: "{{ mysql_fqdn }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  when: book_count.query_result[0][0].n | int == 0
  no_log: true
