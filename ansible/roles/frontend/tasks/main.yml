---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Ensure Nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Disable the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify:
    - Test nginx configuration
    - Reload nginx

- name: Deploy EpicBook reverse-proxy site
  ansible.builtin.template:
    src: epicbook.conf.j2
    dest: /etc/nginx/sites-available/epicbook.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Test nginx configuration
    - Reload nginx

- name: Enable EpicBook site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/epicbook.conf
    dest: /etc/nginx/sites-enabled/epicbook.conf
    state: link
  notify:
    - Test nginx configuration
    - Reload nginx
