---
- import_playbook: preflight.yml

- name: Common baseline
  hosts: epicbook
  become: true
  roles:
    - common

- name: Backend - EpicBook application and database
  hosts: backend
  become: true
  roles:
    - backend
    - database     # schema + seed imported BEFORE the app first starts
  tasks:
    - name: Ensure EpicBook is running and enabled at boot
      ansible.builtin.systemd:
        name: epicbook
        state: started
        enabled: true

- name: Frontend - Nginx reverse proxy
  hosts: frontend
  become: true
  roles:
    - frontend

- name: Verify the deployment end to end
  hosts: epicbook
  become: true
  roles:
    - verify
